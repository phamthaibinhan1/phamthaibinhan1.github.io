    * {

      height: 100%;

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      flex: none;
      min-width: 0;
      min-height: 0;
      background: linear-gradient(160deg, #c9d8f0 0%, #b8c8e8 40%, #a8b8d8 100%);
    }

    @media (max-aspect-ratio: 0.5) {

    @media (min-aspect-ratio: 0.75) {

      align-items: center;
      gap: 10px;
      width: clamp(200px, 50vw, 320px);

    #unity-loading-bar {

      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.4);
